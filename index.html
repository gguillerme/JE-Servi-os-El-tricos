<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Recibo - Pousada Paradise</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="notification-container"></div>

    <div class="settings-icon" id="settings-icon" title="Editar dados da Pousada">
        <i class="fas fa-cog"></i>
    </div>

    <div class="container">
        <h1>Gerador de Recibo - Pousada Paradise</h1>
        
        <form id="reciboForm">
            <label for="nomeCliente">Nome do Cliente:</label>
            <input type="text" id="nomeCliente" required>

            <label for="cpfCliente">CPF do Cliente:</label>
            <input type="text" id="cpfCliente" placeholder="000.000.000-00">

            <label for="cnpjCliente">CNPJ do Cliente:</label>
            <input type="text" id="cnpjCliente" placeholder="00.000.000/0000-00">

            <label for="servicoPrestado">Serviço Prestado:</label>
            <input type="text" id="servicoPrestado" required>

            <label for="valor">Valor (R$):</label>
            <input type="text" id="valor" required placeholder="0,00">

            <label for="dataServico">Data:</label>
            <input type="date" id="dataServico" required>

            <div class="buttons">
                <button type="button" id="btnVisualizar">Visualizar Recibo</button>
                <button type="button" id="btnGerarPDF">Baixar PDF</button>
            </div>
        </form>
        
        <div id="reciboPreview" style="display:none;">
            </div>
    </div>

    <div id="settings-modal" class="modal" style="display:none;">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <h2>Configurações da Pousada</h2>
            <label for="pousadaNome">Nome do Emitente:</label>
            <input type="text" id="pousadaNome">

            <label for="pousadaCpf">CPF do Responsável:</label>
            <input type="text" id="pousadaCpf">

            <label for="pousadaResponsavel">Nome do Responsável:</label>
            <input type="text" id="pousadaResponsavel">

            <label for="pousadaWhatsapp">Whatsapp:</label>
            <input type="text" id="pousadaWhatsapp">

            <label for="pousadaEndereco">Endereço:</label>
            <input type="text" id="pousadaEndereco">
            
            <button id="btnSalvarConfig" class="modal-button">Salvar</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://unpkg.com/imask"></script>
    <script src="script.js"></script>
</body>
</html>
